name: tpl-openjdk
description: OpenJDK development (JDK + build deps + source)
parent: tpl-mydev
packages:
  - java-26-openjdk-devel
  - autoconf
  - alsa-lib-devel
  - awk
  - capstone-devel
  - cups-devel
  - file
  - fontconfig-devel
  - freetype-devel
  - libXtst-devel
  - libXt-devel
  - libXrender-devel
  - libXrandr-devel
  - libXi-devel
  - libjpeg-turbo-devel
  - libpng-devel
  - giflib-devel
  - lcms2-devel
  - libffi-devel
  - gcc
  - gcc-c++
  - make
  - gdb
  - zip
  - unzip
repos:
  - url: https://github.com/openjdk/jdk.git
    path: ~/src/jdk
  - url: https://github.com/galderz/colata.git
    path: ~/src/colata
env:
  - name: JAVA_25_HOME
    value: /usr/lib/jvm/java-25
  - name: JAVA_26_HOME
    value: /usr/lib/jvm/java-26
