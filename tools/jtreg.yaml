name: jtreg
description: JTReg 8.3.1

downloads:
  - url: https://builds.shipilev.net/jtreg/jtreg-8.3%2B1.zip
    sha256: 74db8dbb122fb01217e2ca13129c0cffa7ece3ac5eb6a47d934130d6ed0855c2
    extract: /opt
    links:
      /opt/jtreg/bin/jtreg: /usr/local/bin/jtreg

env:
  - export JTREG_HOME=/opt/jtreg
  - export JTREG_JAVA=/usr/lib/jvm/java-latest-openjdk

run:
  - chmod -R a+rX /opt/jtreg

verify: jtreg -version
